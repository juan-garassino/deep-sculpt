name: build-push

on:
  push:
    branches: [main]
    paths:
      - 'runpod/**'
      - 'deepsculpt/**'
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write # WIF auth for the Artifact Registry mirror

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP via WIF
        id: gcp_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RUNTIME_SA }}
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: runpod/Dockerfile
          push: true
          # GHCR is the public canonical registry; the GAR copy exists because
          # Vertex AI custom training can only pull from Artifact Registry.
          tags: |
            ghcr.io/juan-garassino/deepsculpt-runpod:latest
            ghcr.io/juan-garassino/deepsculpt-runpod:${{ github.sha }}
            europe-west1-docker.pkg.dev/garassino-ml/ml-images/deepsculpt:latest
            europe-west1-docker.pkg.dev/garassino-ml/ml-images/deepsculpt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
